name: Deploy to Modal

on:
  # Auto-deploy-on-push disabled (2026-10-04): the Modal app was stopped
  # to stop billing. Run this manually (Actions tab -> Run workflow, or
  # `gh workflow run deploy-modal.yml`) to redeploy when it's wanted again.
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run modal deploy deploy/modal_app.py
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
