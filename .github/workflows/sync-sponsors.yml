name: Sync IND sponsors

on:
  # Monthly cron disabled (2026-10-04): paused alongside the Modal
  # deployment to stop recurring activity. Run manually (Actions tab ->
  # Run workflow, or `gh workflow run sync-sponsors.yml`) any time, or
  # restore the schedule once the app is redeployed.
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run jf sync-sponsors
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: monthly IND sponsor sync"
          file_pattern: data/sponsors_latest.json
