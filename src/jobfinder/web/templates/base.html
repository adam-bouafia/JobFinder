<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JobFinder</title>
<script src="/static/htmx.min.js"></script>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    max-width: 640px;
    margin: 3rem auto;
    padding: 0 1rem;
  }
  h1 { font-size: 1.4rem; margin-bottom: 0.25rem; }
  .meta { color: #6b6b6b; font-size: 0.9rem; margin-bottom: 2rem; }
  form { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
  input[type=text] {
    flex: 1;
    padding: 0.6rem 0.8rem;
    font-size: 1rem;
    border: 1px solid #ccc;
    border-radius: 6px;
  }
  button {
    padding: 0.6rem 1.2rem;
    font-size: 1rem;
    border: 1px solid #1a1a1a;
    background: #1a1a1a;
    color: #fff;
    border-radius: 6px;
    cursor: pointer;
  }
  .result {
    padding: 0.9rem 1rem;
    border-radius: 6px;
    margin-top: 0.5rem;
  }
  .result.yes { background: #e6f4ea; border: 1px solid #34a853; color: #1a1a1a; }
  .result.no { background: #fce8e6; border: 1px solid #ea4335; color: #1a1a1a; }
  .result .name { font-weight: 600; }
  .result .detail { color: #555; font-size: 0.85rem; margin-top: 0.2rem; }
  footer { margin-top: 3rem; color: #9a9a9a; font-size: 0.8rem; }
  a { color: inherit; }
</style>
</head>
<body>
{% block content %}{% endblock %}
</body>
</html>
