<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>
  // Applied before paint, in <head>, so there's no flash of the wrong
  // theme - the toggle's click handler lives near the end of <body>.
  (function () {
    try {
      var saved = localStorage.getItem("jobfinder-theme");
      if (saved) document.documentElement.setAttribute("data-theme", saved);
    } catch (e) {}
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JobFinder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="/static/htmx.min.js"></script>
<style>
  :root {
    color-scheme: light dark;
    --fg: #111111;
    --bg: #ffffff;
    --muted: #888888;
    /* hairline dividers as a faint tint of the ink color, not a flat grey -
       same idea as virtuallyeverafter.xyz's --line/--line-hard tokens */
    --rule: rgba(17, 17, 17, .14);
    --rule-hard: rgba(17, 17, 17, .32);
    --grid-line: rgba(17, 17, 17, .4);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --fg: #e8e8e8; --bg: #0a0a0a; --muted: #8a8a8a;
      --rule: rgba(233, 231, 226, .16); --rule-hard: rgba(233, 231, 226, .34);
      --grid-line: rgba(233, 231, 226, .32);
    }
  }
  :root[data-theme="dark"] {
    --fg: #e8e8e8; --bg: #0a0a0a; --muted: #8a8a8a;
    --rule: rgba(233, 231, 226, .16); --rule-hard: rgba(233, 231, 226, .34);
    --grid-line: rgba(233, 231, 226, .32);
  }
  * { box-sizing: border-box; }
  body {
    font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: var(--bg);
    color: var(--fg);
    max-width: 640px;
    margin: 3rem auto;
    padding: 0 1.25rem 4rem;
    line-height: 1.55;
  }
  h1 {
    font-size: 1.6rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-align: center;
    margin: 0 0 0.6rem;
  }
  .meta {
    color: var(--muted);
    font-size: 0.8rem;
    text-align: center;
    margin-bottom: 2rem;
  }
  .meta code { font-size: 0.78rem; }
  .export-links a { margin: 0 0.4rem; text-decoration: underline; }
  .export-links a:first-of-type { margin-left: 0.4rem; }
  hr {
    border: none;
    border-top: 1px solid var(--rule);
    margin: 2.5rem 0;
  }
  code {
    font-family: inherit;
    background: transparent;
    border: 1px solid var(--rule);
    padding: 0.05rem 0.3rem;
    font-size: 0.9em;
  }
  form { margin-bottom: 0.75rem; }
  .search-row { display: flex; gap: 0.6rem; margin-bottom: 0.9rem; }
  input[type=text] {
    flex: 1;
    font-family: inherit;
    padding: 0.6rem 0.8rem;
    font-size: 0.95rem;
    background: var(--bg);
    color: var(--fg);
    border: 1px solid var(--rule);
    border-radius: 0;
  }
  input[type=text]:focus { outline: none; border-color: var(--fg); }
  select {
    font-family: inherit;
    font-size: 0.78rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    background: var(--bg);
    color: var(--muted);
    border: 1px solid var(--rule);
    padding: 0.4rem 0.6rem;
    border-radius: 0;
  }
  button {
    font-family: inherit;
    padding: 0.6rem 1.2rem;
    font-size: 0.8rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border: 1px solid var(--fg);
    background: var(--bg);
    color: var(--fg);
    border-radius: 0;
    cursor: pointer;
    transition: background 0.1s, color 0.1s;
  }
  button:hover { background: var(--fg); color: var(--bg); }
  .result {
    padding: 0.9rem 0;
    border-top: 1px solid var(--rule);
    margin-top: 0.5rem;
  }
  .result .name { font-weight: 600; }
  .result .name::before { content: "\25cf  "; }
  .result.no .name { color: var(--muted); }
  .result.no .name::before { content: "\25cb  "; }
  .result .detail { color: var(--muted); font-size: 0.8rem; margin-top: 0.3rem; }
  footer {
    margin-top: 3.5rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--rule);
    color: var(--muted);
    font-size: 0.75rem;
    text-align: center;
    letter-spacing: 0.02em;
  }
  a { color: inherit; }

  /* Perspective grid lines, fixed behind the page content - the "lines"
     from the virtuallyeverafter.xyz reference (a 3D wireframe gallery
     tunnel), approximated in plain CSS: two grids tilted away via
     perspective/rotateX to converge toward the center, fading out with a
     mask so they stay a backdrop, not noise. Negative z-index paints them
     above the page's own background but below all normal static content
     (painting order: canvas bg, then negative-z descendants, then in-flow
     content) - no transparency tricks needed on body/html. */
  .scene-grid {
    position: fixed;
    inset: 0;
    z-index: -1;
    overflow: hidden;
    pointer-events: none;
  }
  .scene-grid::before, .scene-grid::after {
    content: "";
    position: absolute;
    left: 50%;
    width: 280vw;
    height: 85vh;
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  .scene-grid::before {
    top: -8vh;
    transform-origin: center top;
    transform: translateX(-50%) perspective(320px) rotateX(78deg);
    -webkit-mask-image: linear-gradient(to top, #000 0%, transparent 92%);
    mask-image: linear-gradient(to top, #000 0%, transparent 92%);
  }
  .scene-grid::after {
    bottom: -8vh;
    transform-origin: center bottom;
    transform: translateX(-50%) perspective(320px) rotateX(-78deg);
    -webkit-mask-image: linear-gradient(to bottom, #000 0%, transparent 92%);
    mask-image: linear-gradient(to bottom, #000 0%, transparent 92%);
  }

  .corner-bar {
    position: relative;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 2.5rem;
    font-size: 0.68rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .corner-left {
    display: flex;
    gap: 0.9rem;
    align-items: center;
    flex-wrap: wrap;
    color: var(--muted);
    padding-top: 0.4rem;
  }
  .corner-left a { text-decoration: none; }
  .corner-left a:hover { color: var(--fg); }
  .corner-right { position: relative; }
  #menu-toggle {
    font-family: inherit;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    background: none;
    border: 1px solid var(--rule);
    color: var(--fg);
    padding: 0.4rem 0.75rem;
    cursor: pointer;
  }
  #menu-toggle:hover { border-color: var(--fg); }
  .menu-panel {
    position: absolute;
    top: calc(100% + 0.5rem);
    right: 0;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    border: 1px solid var(--rule);
    min-width: 11rem;
    z-index: 10;
  }
  .menu-panel[hidden] { display: none; }
  .menu-panel a, .menu-panel #theme-toggle {
    display: block;
    width: 100%;
    text-align: left;
    padding: 0.6rem 0.8rem;
    border: none;
    border-top: 1px solid var(--rule);
    background: none;
    color: var(--muted);
    text-decoration: none;
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .menu-panel a:first-child { border-top: none; }
  .menu-panel a:hover, .menu-panel #theme-toggle:hover { color: var(--fg); background: var(--rule); }
  .menu-panel a.active { color: var(--fg); }
  .filters {
    display: flex;
    gap: 1.5rem;
    margin-bottom: 1.5rem;
    font-size: 0.78rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    flex-wrap: wrap;
    align-items: center;
  }
  .filters label { display: flex; align-items: center; gap: 0.4rem; cursor: pointer; color: var(--muted); }
  .job-list { display: flex; flex-direction: column; }
  .job-card {
    padding: 1.1rem 0;
    border-top: 1px solid var(--rule);
    transition: border-color .3s;
  }
  .job-card:last-child { border-bottom: 1px solid var(--rule); }
  .job-card:hover { border-top-color: var(--rule-hard); }
  .job-card .title { font-weight: 600; }
  .job-card .company { color: var(--muted); font-size: 0.85rem; margin-top: 0.1rem; }
  .job-card .tags {
    margin-top: 0.5rem;
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .tag.sponsor { color: var(--fg); }
  .tag.sponsor::before { content: "\25cf  "; }
  .tag.open-app::before { content: "\2192  "; }
  .job-card a.link { font-size: 0.78rem; display: inline-block; margin-top: 0.5rem; }
  .description {
    margin-top: 0.6rem;
    font-size: 0.82rem;
  }
  .description summary {
    cursor: pointer;
    color: var(--muted);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    font-size: 0.72rem;
  }
  .description p {
    white-space: pre-wrap;
    margin: 0.6rem 0 0;
    max-height: 16rem;
    overflow-y: auto;
  }
  .coffee-cat { display: inline-flex; align-items: center; gap: 0.3rem; }
  .banner {
    border: 1px solid var(--rule);
    padding: 0.6rem 0.9rem;
    font-size: 0.85rem;
    margin-bottom: 1.2rem;
  }
  .banner.success { border-color: var(--fg); }
  .banner.error { border-color: var(--fg); color: var(--fg); }
  .search-bar { display: flex; gap: 0.6rem; align-items: flex-start; }
  .search-bar .search-form { flex: 1; margin-bottom: 0; }
  .resume-upload-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 2.6rem;
    height: 2.6rem;
    flex-shrink: 0;
    border: 1px solid var(--rule);
    font-size: 0.68rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
    cursor: pointer;
    text-align: center;
    line-height: 1.1;
  }
  .resume-upload-btn:hover { border-color: var(--fg); color: var(--fg); }
  .resume-upload-btn input[type=file] {
    position: absolute;
    width: 1px;
    height: 1px;
    opacity: 0;
  }
  .city-input {
    font-family: inherit;
    font-size: 0.78rem;
    background: var(--bg);
    color: var(--fg);
    border: 1px solid var(--rule);
    padding: 0.35rem 0.6rem;
    width: 9rem;
  }
  .city-input:focus { outline: none; border-color: var(--fg); }
  .resume-status { text-align: left; margin: -0.8rem 0 1.5rem; }

  /* Custom difference-blend cursor, desktop only - same trick as
     virtuallyeverafter.xyz: a small circle that mix-blend-mode:difference
     inverts whatever's under it, so it reads as dark-on-light and
     light-on-dark without any theme-specific color. JS only hides the
     real cursor (html.hascur) once this div has actually mounted, so a
     script failure never leaves the page with an invisible pointer. */
  @media (min-width: 861px) and (hover: hover) and (pointer: fine) {
    html.hascur, html.hascur a, html.hascur button, html.hascur input,
    html.hascur select, html.hascur label { cursor: none; }
  }
  #cur {
    position: fixed;
    left: 0;
    top: 0;
    z-index: 2147483646;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #fff;
    mix-blend-mode: difference;
    pointer-events: none;
    transform: translate(-50%, -50%);
    transition: width .2s ease, height .2s ease;
  }
  #cur.cur-hover { width: 22px; height: 22px; }
</style>
</head>
<body>
<div class="scene-grid" aria-hidden="true"></div>
<header class="corner-bar">
  <div class="corner-left">
    <a href="https://github.com/adam-bouafia" target="_blank" rel="noopener">GitHub</a>
    <a href="https://www.linkedin.com/in/adam-bouafia" target="_blank" rel="noopener">LinkedIn</a>
    <a href="https://adam-bouafia.github.io" target="_blank" rel="noopener">Portfolio</a>
    <a href="https://paypal.me/AdamBouafia" target="_blank" rel="noopener" class="coffee-cat" title="This cat has not eaten in 3 days">
      <svg width="16" height="14" viewBox="0 0 20 18" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 6 L2 1 L7 4.5 Z"/>
        <path d="M16 6 L18 1 L13 4.5 Z"/>
        <circle cx="10" cy="10" r="6.5"/>
        <circle cx="7.6" cy="9" r="0.6" fill="currentColor" stroke="none"/>
        <circle cx="12.4" cy="9" r="0.6" fill="currentColor" stroke="none"/>
        <path d="M9.3 11.3 L10.7 11.3 L10 12.2 Z" fill="currentColor" stroke="none"/>
        <path d="M10 12.2 Q9 13.4 7.8 12.6 M10 12.2 Q11 13.4 12.2 12.6"/>
        <path d="M3.5 10 L0.5 9.3 M3.5 11 L0.5 11.5"/>
        <path d="M16.5 10 L19.5 9.3 M16.5 11 L19.5 11.5"/>
      </svg>
      Coffee
    </a>
  </div>
  <div class="corner-right">
    <button id="menu-toggle" type="button" aria-expanded="false" aria-controls="menu-panel">Menu</button>
    <div id="menu-panel" class="menu-panel" hidden>
      <a href="/" class="{{ 'active' if active_nav == 'home' else '' }}">Jobs</a>
      <a href="/company" class="{{ 'active' if active_nav == 'company' else '' }}">Check a Company</a>
      <button id="theme-toggle" type="button">Theme</button>
    </div>
  </div>
</header>
{% block content %}{% endblock %}
<script>
  (function () {
    var root = document.documentElement;
    var btn = document.getElementById("theme-toggle");
    function currentTheme() {
      var saved = null;
      try { saved = localStorage.getItem("jobfinder-theme"); } catch (e) {}
      if (saved) return saved;
      var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      return prefersDark ? "dark" : "light";
    }
    function updateLabel() {
      btn.textContent = currentTheme() === "dark" ? "Light mode" : "Dark mode";
    }
    updateLabel();
    btn.addEventListener("click", function () {
      var next = currentTheme() === "dark" ? "light" : "dark";
      root.setAttribute("data-theme", next);
      try { localStorage.setItem("jobfinder-theme", next); } catch (e) {}
      updateLabel();
    });
  })();

  (function () {
    var toggle = document.getElementById("menu-toggle");
    var panel = document.getElementById("menu-panel");
    if (!toggle || !panel) return;
    toggle.addEventListener("click", function (e) {
      e.stopPropagation();
      var opening = panel.hidden;
      panel.hidden = !opening;
      toggle.setAttribute("aria-expanded", String(opening));
    });
    document.addEventListener("click", function (e) {
      if (!panel.hidden && e.target !== toggle && !panel.contains(e.target)) {
        panel.hidden = true;
        toggle.setAttribute("aria-expanded", "false");
      }
    });
  })();

  (function () {
    // Custom difference-blend cursor, desktop/mouse only. Mirrors the
    // trick on virtuallyeverafter.xyz. html.hascur (which actually hides
    // the real cursor, see CSS above) is only set once #cur is in the DOM
    // and tracking the mouse - if anything here throws, the native cursor
    // is simply never hidden, never left invisible.
    if (!window.matchMedia || !window.matchMedia("(min-width: 861px) and (hover: hover) and (pointer: fine)").matches) return;
    try {
      var cur = document.createElement("div");
      cur.id = "cur";
      document.body.appendChild(cur);
      document.addEventListener("mousemove", function (e) {
        cur.style.left = e.clientX + "px";
        cur.style.top = e.clientY + "px";
      });
      document.addEventListener("mouseover", function (e) {
        cur.classList.toggle("cur-hover", !!e.target.closest("a, button, input, select, label"));
      });
      document.documentElement.classList.add("hascur");
    } catch (e) {}
  })();
</script>
</body>
</html>
